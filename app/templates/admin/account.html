{% extends "base.html" %}
{% block content %}
<h1>{{ t('admin.change_pw') }}</h1>
{% if message %}<p class="alert ok">{{ t(message) }}</p>{% endif %}
{% if error %}<p class="alert bad">{{ t(error) }}</p>{% endif %}
<form method="post" action="/account" class="stack narrow">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>{{ t('account.current') }}<input name="current" type="password" autocomplete="current-password" required></label>
  <label>{{ t('account.new') }}<input name="new" type="password" autocomplete="new-password" minlength="12" required></label>
  <label>{{ t('account.confirm') }}<input name="confirm" type="password" autocomplete="new-password" minlength="12" required></label>
  <button class="btn primary">{{ t('save') }}</button>
</form>
{% endblock %}
